{% extends "base.html" %}

{% block title %}Page non trouvée{% endblock %}

{% block content %}
<div class="container text-center mt-5">
    <h1 class="display-1">404</h1>
    <p class="lead">Oups! La page que vous recherchez n'existe pas.</p>
    <p>Il semble que vous ayez suivi un lien incorrect ou saisi une URL qui n'existe pas sur ce site.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-3">Retour à l'accueil</a>
</div>
{% endblock %}
