{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Chatbot Médical</h2>
    <div class="card">
        <div class="card-header">
            Bonjour {{ current_user.first_name|default(current_user.email) }}, posez votre question médicale
        </div>
        <div class="card-body">
            <div id="chat-container" class="chat-window">
                <!-- Messages will appear here -->
            </div>
            <div class="input-group mt-3">
                <input type="text" id="user-input" class="form-control" placeholder="Posez votre question..." autofocus>
                <button id="send-btn" class="btn btn-primary">Envoyer</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    let csrfToken = '';

    // Récupérer le token CSRF
    fetch('/csrf-token')
        .then(response => response.json())
        .then(data => {
            csrfToken = data.csrf_token;
        });

    // Message de bienvenue
    addMessage('MedBot', 'Bonjour! Je suis votre assistant médical. Posez-moi vos questions.');

    function addMessage(sender, message) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('chat-message', sender === 'MedBot' ? 'bot-message' : 'user-message');
        messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        addMessage('Vous', message);
        userInput.value = '';
        
        try {
            const response = await fetch('/api/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ 
                    message: message,
                    user_id: '{{ current_user.get_id() if current_user.is_authenticated else "anonymous" }}'
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Erreur inconnue");
            
            addMessage('MedBot', data.text || data.response);
        } catch (error) {
            console.error('Erreur:', error);
            addMessage('MedBot', `Erreur: ${error.message}`);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
});
</script>

<style>
.chat-window {
    height: 400px;
    overflow-y: auto;
    padding: 15px;
    margin-bottom: 20px;
    border: 1px solid #dee2e6;
    border-radius: 5px;
    background-color: #f8f9fa;
}
.chat-message {
    margin-bottom: 12px;
    padding: 10px 15px;
    border-radius: 18px;
    max-width: 80%;
    word-wrap: break-word;
}
.user-message {
    background-color: #007bff;
    color: white;
    margin-left: auto;
}
.bot-message {
    background-color: #e9ecef;
    margin-right: auto;
    border: 1px solid #ddd;
}
</style>
{% endblock %}
